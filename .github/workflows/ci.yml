name: ci
on:
  push: { branches: [main] }
  pull_request:
  # Run workflow in the Actions tab builds and publishes the image of the branch you pick (main) on demand.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt && pytest -q
  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    # One image push at a time, in merge order: a queued run replaces older
    # queued ones, so the newest commit always publishes `latest` last.
    concurrency: { group: image-latest, cancel-in-progress: false }
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: built
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        env:
          # No ".dockerbuild" build-record artifact per run (they pile up in Actions storage).
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          push: true
          # A plain single-platform image: no provenance/SBOM manifests, so every untagged version is a real leftover.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/thesingularis/kosmos:latest
            ghcr.io/thesingularis/kosmos:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            PANEL_COMMIT=${{ github.sha }}
            PANEL_BUILT=${{ steps.built.outputs.date }}
  # Off until the repository variable AUTO_PRUNE is set to "true" (Settings > Secrets and variables > Actions > Variables).
  prune:
    needs: image
    if: vars.AUTO_PRUNE == 'true'
    permissions: { contents: read, packages: write, actions: write }
    uses: ./.github/workflows/cleanup.yml
    with: { dry_run: false }
