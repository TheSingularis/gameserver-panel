name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt && pytest -q
  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    # One image push at a time, in merge order: a queued run replaces older
    # queued ones, so the newest commit always publishes `latest` last.
    concurrency: { group: image-latest, cancel-in-progress: false }
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: built
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: "ghcr.io/thesingularis/kosmos:latest"
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            PANEL_COMMIT=${{ github.sha }}
            PANEL_BUILT=${{ steps.built.outputs.date }}
