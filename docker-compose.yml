# Production / Unraid: pulls the prebuilt image. Watchtower picks it up via the label below.
services:
  gameserver-panel:
    image: ghcr.io/thesingularis/gameserver-panel:latest
    container_name: gameserver-panel
    restart: unless-stopped
    network_mode: host        # real ports, no Docker NAT in the way of Steam/server list
    labels:
      com.centurylinklabs.watchtower.enable: "true"   # for Watchtower run with --label-enable (harmless otherwise)
    environment:
      PANEL_PASSWORD: change-me-please   # min 8 chars; may be left out if OIDC_* is configured
      PANEL_PORT: "8080"                 # LAN-only: do NOT forward this port on your router
      # Optional Keycloak / OIDC sign-in. See README.
      # OIDC_ISSUER: https://keycloak.example/realms/home
      # OIDC_CLIENT_ID: gameserver-panel
      # OIDC_CLIENT_SECRET: ""             # omit for a public client
      # OIDC_PUBLIC_URL: http://tower:8080 # redirect URI = this + /auth/callback
      # OIDC_ALLOWED_GROUPS: gamers        # and/or OIDC_ALLOWED_USERS: jordan,sam
    volumes:
      - ${PANEL_DATA_DIR:-/mnt/user/appdata/gameserver-panel}:/data   # Unraid appdata by default
